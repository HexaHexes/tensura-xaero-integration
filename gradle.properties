# Optional dependency pins. The file ids are CurseMaven coordinates; the mod
# versions are what those files contain and are what neoforge.mods.toml ranges
# are built from. Bump both deliberately, together, after re-checking the API.
# See docs/COMPATIBILITY.md - the Xaero integration is pinned to exact versions
# on purpose.
tensura_file_id=8793360
tensura_mod_version=2.0.1.3
manascore_file_id=8022425
architectury_file_id=8492726
geckolib_file_id=8893490
smartbrainlib_file_id=7055149
terrablender_file_id=6054947
xaero_minimap_file_id=9067173
xaero_minimap_mod_version=26.6.0
xaero_world_map_file_id=9067277
xaero_world_map_mod_version=1.47.0

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=tensura_xaero_integration
mod_name=Tensura Xaero Integration
mod_license=GNU Lesser General Public License v2.1
mod_version=0.1.0-alpha.14
mod_group_id=org.bitwisemadness.tensuraxaerointegration
mod_authors=Bitwise Madness
mod_description=Shows Tensura: Reincarnated's ambient chunk magicule as a translucent overlay on Xaero's Minimap and Xaero's World Map, and reports the hovered chunk's concentration on the world map. Only mapped chunks are ever displayed or transmitted.

# The single source of truth for the version. ci.yml reads this line, and
