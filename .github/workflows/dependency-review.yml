name: Dependency review

# Free PR gate: fails when a pull request *introduces* a dependency with a
# known vulnerability or an unacceptable license change - a diff against the
# base commit, so pre-existing debt never blocks. The snapshot it diffs comes
# from dependency-submission.yml; retry-on-snapshot-warnings makes it wait
# for that PR-head submission instead of racing it. Public repos: $0. #30.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Defaults: fail on any introduced severity + built-in license
      # detection. No allow/deny lists yet - that policy is a later,
      # separate decision (recorded in issue #30).
      - name: Review the dependency diff
        uses: actions/dependency-review-action@v5
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
