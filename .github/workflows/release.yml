name: Release

# Runs on pushes to the default branch: when gradle.properties carries a version
# that has no matching v-published release yet, build the jar and publish it as a
# GitHub release for that tag. Everything the mod ships rides inside that jar, so
# there is no separate archive to assemble.
#
# Promoted from tensura-iaf-growth, the org's reference implementation (tracked by
# neoforge-mod-template #4). Two deliberate differences from a mod repo's copy:
#
#   - the jar name is derived from mod_id instead of written out, because this file
#     is copied into repos whose archivesName follows their own mod_id, so a rename
#     needs no edit here;
#   - the release notes are an example - edit them when promoting this file into a
#     mod. They are player-facing, and the README rule about that applies.
#
# Pre-releases are opt-in: an -alpha or -beta version publishes only when the
# repository variable ALPHA_RELEASES is true, so a pre-release train cannot reach
# the releases page by accident.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  # Dispatching the publishing workflows below needs actions: write - an
  # explicit permissions block zeroes every scope it does not name.
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve the version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RELEASES: ${{ vars.ALPHA_RELEASES }}
        run: |
          set -euo pipefail

          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "mod version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          SKIP=false

          # Ask GitHub rather than the local refs: actions/checkout does not
          # fetch tags by default, so a refs/tags probe would never fire and
          # the publish step would collide with the release it is meant to skip.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to release."
            SKIP=true
          fi

          case "$VERSION" in
            *-alpha*|*-beta*)
              if [ "${ALPHA_RELEASES:-true}" != "true" ]; then
                echo "$VERSION is a pre-release and ALPHA_RELEASES is set to false; skipping (explicit opt-out)."
                SKIP=true
              fi ;;
          esac

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Build the jar
        if: steps.resolve.outputs.skip == 'false'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish the release
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="build/libs/$MOD_ID-$VERSION.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected $JAR after the build; found:"
            ls -l build/libs
            exit 1
          fi

          # Release bodies are GitHub-native auto-generated changelogs
          # (.github/release.yml configures the categories): the notes list the
          # merged PRs since the previous release. No per-repo promo body.

          PRERELEASE=""
          case "$VERSION" in
            *-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "v$VERSION" "$JAR" \
            --title "v$VERSION" \
            --generate-notes \
            $PRERELEASE

      # GitHub refuses to cascade workflow runs started by the default
      # GITHUB_TOKEN, so the "release: published" trigger only ever fires for
      # releases created by hand. Dispatch the publishing workflows directly
      # instead - they are deliberately separate from this one, so a Modrinth
      # or Packages outage never fails the release itself. Workflows that are
      # not present in a repo are skipped, so this file needs no edit when a
      # repo has not adopted one of them yet.
      - name: Dispatch the publishing workflows
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ -f .github/workflows/publish.yml ]; then
            gh workflow run publish.yml
            echo "Dispatched publish.yml."
          fi
          if [ -f .github/workflows/modrinth.yml ]; then
            gh workflow run modrinth.yml -f tag="v$VERSION"
            echo "Dispatched modrinth.yml for v$VERSION."
          fi
          if [ -f .github/workflows/curseforge.yml ]; then
            gh workflow run curseforge.yml -f tag="v$VERSION"
            echo "Dispatched curseforge.yml for v$VERSION."
          fi